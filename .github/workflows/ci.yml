name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduverse
          POSTGRES_PASSWORD: eduverse123
          POSTGRES_DB: eduverse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: |
          cd apps/frontend && npm run type-check
          cd ../backend && npm run build

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://eduverse:eduverse123@localhost:5432/eduverse_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          NODE_ENV: test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://eduverse:eduverse123@localhost:5432/eduverse_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker-compose build

      - name: Test Docker setup
        run: |
          docker-compose up -d
          sleep 30
          docker-compose ps
          docker-compose down
