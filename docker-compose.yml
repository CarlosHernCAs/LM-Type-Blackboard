version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: eduverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduverse
      POSTGRES_PASSWORD: eduverse123
      POSTGRES_DB: eduverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - eduverse-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: eduverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - eduverse-network

  # MongoDB (para contenido de cursos)
  mongodb:
    image: mongo:7
    container_name: eduverse-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: eduverse
      MONGO_INITDB_ROOT_PASSWORD: eduverse123
      MONGO_INITDB_DATABASE: eduverse_content
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - eduverse-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: eduverse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eduverse
      MINIO_ROOT_PASSWORD: eduverse123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - eduverse-network

  # Elasticsearch (búsqueda)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: eduverse-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - eduverse-network

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  minio-data:
  elasticsearch-data:

networks:
  eduverse-network:
    driver: bridge
